name: Deploy Nifti to GitHub Pages

on:
  push:
    branches: ["claude/supabase-mcp-connection-j8plcc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight one finish rather than cancel it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nifti_Sept17.html stays the one source file in the repo; this just serves it as
      # index.html so the site works at the plain root URL, with zero risk of a second
      # copy drifting out of sync.
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp Nifti_Sept17.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
